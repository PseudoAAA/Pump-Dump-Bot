version: '3.8'

services:
  pump-bot:
    build: .
    container_name: pump_dump_bot
    depends_on:
      - db
    env_file:
      - .env
    environment:

      - DB_HOST=db
    volumes:
      - .:/app
      - ./charts:/app/charts
    restart: always

  db:
    image: postgres:15-alpine
    container_name: pump_bot_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=pseudo
      - POSTGRES_DB=PumpDump
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: